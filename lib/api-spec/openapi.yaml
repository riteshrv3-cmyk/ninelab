openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ninelab API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: students
    description: Student profile operations
  - name: quests
    description: Quest and roadmap operations
  - name: interview
    description: Mock interview operations
  - name: jobs
    description: Job matching operations
  - name: leaderboard
    description: Leaderboard operations
  - name: anthropic
    description: Anthropic AI chat operations
  - name: resumes
    description: AI-generated, per-JD tailored resume operations
  - name: courses
    description: Course enrollment, progress, exams, and certificate operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /students:
    post:
      operationId: createStudent
      tags: [students]
      summary: Create a new student profile (onboarding)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudentBody"
      responses:
        "201":
          description: Created student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /students/{id}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Get student by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateStudent
      tags: [students]
      summary: Update student profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentBody"
      responses:
        "200":
          description: Updated student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /students/by-email/{email}:
    get:
      operationId: getStudentByEmail
      tags: [students]
      summary: Get student by email
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /students/{id}/dashboard:
    get:
      operationId: getStudentDashboard
      tags: [students]
      summary: Get full dashboard data for a student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardData"

  /students/{id}/wrapped:
    get:
      operationId: getStudentWrapped
      tags: [students]
      summary: Get career wrapped data for a student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Career wrapped data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerWrapped"

  /quests:
    get:
      operationId: listQuests
      tags: [quests]
      summary: List quests filtered by field and year
      parameters:
        - name: field
          in: query
          schema:
            type: string
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of quests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quest"

  /students/{id}/quests:
    get:
      operationId: getStudentQuests
      tags: [quests]
      summary: Get quest progress for a student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of student quest statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentQuestStatus"

  /students/{id}/quests/{questId}/complete:
    post:
      operationId: completeQuest
      tags: [quests]
      summary: Mark a quest as complete and award XP
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: questId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated student after XP award
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /ai/analyze-github:
    post:
      operationId: analyzeGithub
      tags: [students]
      summary: Analyze GitHub profile and return skills
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeGithubBody"
      responses:
        "200":
          description: Analyzed skills
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillsResult"

  /ai/generate-roadmap:
    post:
      operationId: generateRoadmap
      tags: [quests]
      summary: Generate personalized roadmap milestones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRoadmapBody"
      responses:
        "200":
          description: Generated roadmap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadmapResult"

  /interview/sessions:
    post:
      operationId: createInterviewSession
      tags: [interview]
      summary: Start a new mock interview session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInterviewSessionBody"
      responses:
        "201":
          description: Created session with first question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"

  /interview/sessions/{id}/question:
    post:
      operationId: getNextInterviewQuestion
      tags: [interview]
      summary: Get next interview question based on previous answers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAnswerBody"
      responses:
        "200":
          description: Next question or completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewQuestionResponse"

  /interview/sessions/{id}/evaluate:
    post:
      operationId: evaluateInterview
      tags: [interview]
      summary: Evaluate completed interview session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Interview evaluation results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewEvaluation"

  /interview/sessions/{id}/feedback:
    patch:
      operationId: submitInterviewFeedback
      tags: [interview]
      summary: Submit post-interview confidence feedback
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewFeedbackBody"
      responses:
        "200":
          description: Feedback saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /interview/sessions/{id}:
    get:
      operationId: getInterviewSession
      tags: [interview]
      summary: Get interview session details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Interview session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List available jobs
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

  /students/{id}/job-matches:
    get:
      operationId: getJobMatches
      tags: [jobs]
      summary: Get job matches for a student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobMatch"
    post:
      operationId: generateJobMatches
      tags: [jobs]
      summary: Generate/refresh job matches for a student using AI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated job matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobMatch"

  /leaderboard/college:
    get:
      operationId: getCollegeLeaderboard
      tags: [leaderboard]
      summary: Get college-wise leaderboard
      parameters:
        - name: college
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: College leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /leaderboard/india:
    get:
      operationId: getIndiaLeaderboard
      tags: [leaderboard]
      summary: Get India college-wise leaderboard
      responses:
        "200":
          description: India leaderboard by college
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollegeLeaderboardEntry"

  /anthropic/conversations:
    get:
      operationId: listAnthropicConversations
      tags: [anthropic]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicConversation"
    post:
      operationId: createAnthropicConversation
      tags: [anthropic]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnthropicConversationBody"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversation"
  /anthropic/conversations/{id}:
    get:
      operationId: getAnthropicConversation
      tags: [anthropic]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
    delete:
      operationId: deleteAnthropicConversation
      tags: [anthropic]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
  /anthropic/conversations/{id}/messages:
    get:
      operationId: listAnthropicMessages
      tags: [anthropic]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicMessage"
    post:
      operationId: sendAnthropicMessage
      tags: [anthropic]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendAnthropicMessageBody"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}

  /students/{id}/resumes:
    get:
      operationId: listResumes
      tags: [resumes]
      summary: List a student's saved resumes, newest first
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of resumes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resume"
    post:
      operationId: generateResume
      tags: [resumes]
      summary: Generate a new AI-tailored resume via the 4-stage pipeline (JD analysis, evidence mapping, drafting, adversarial critique)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateResumeBody"
      responses:
        "201":
          description: Generated resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resume"
        "400":
          description: Invalid template or request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Student not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /students/{id}/resumes/{resumeId}:
    patch:
      operationId: updateResume
      tags: [resumes]
      summary: Edit a resume's content and/or switch its template — ATS score is recomputed deterministically against the edited content
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: resumeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResumeBody"
      responses:
        "200":
          description: Updated resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resume"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Resume not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteResume
      tags: [resumes]
      summary: Delete a resume
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: resumeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        "404":
          description: Resume not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /students/{id}/resumes/{resumeId}/improve-section:
    post:
      operationId: improveResumeSection
      tags: [resumes]
      summary: AI-polish one section against its failing quality rules — evidence-gated, returns the new value without persisting it
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: resumeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImproveSectionBody"
      responses:
        "200":
          description: Improved section value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImproveSectionResult"
        "422":
          description: Rewrite failed the anti-fabrication check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /students/{id}/resumes/{resumeId}/review:
    post:
      operationId: reviewResume
      tags: [resumes]
      summary: On-demand AI judge review (recruiter 7-second read, per-section notes, top fixes) — content-hash cached, persisted on the row
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: resumeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The review plus band/percentile framing derived from the deterministic quality score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeReview"

  /students/{id}/resumes/{resumeId}/quant-questions:
    post:
      operationId: quantQuestions
      tags: [resumes]
      summary: Generate micro-questions for unquantified bullets (the quantification coach) — cached per bullet-set
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: resumeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Questions grouped per bullet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuantQuestionsResult"

  /students/{id}/resumes/{resumeId}/quant-apply:
    post:
      operationId: quantApply
      tags: [resumes]
      summary: Rewrite one bullet embedding ONLY user-attested numbers — deterministic digit verification with an append fallback, never fails for the student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: resumeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuantApplyBody"
      responses:
        "200":
          description: The rewritten bullet and updated quant facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuantApplyResult"
        "400":
          description: Answer is not a plain number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /students/{id}/courses/enroll:
    post:
      operationId: enrollCourse
      tags: [courses]
      summary: Enroll in (or resume) a course for a subdomain
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollCourseBody"
      responses:
        "200":
          description: Course enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseEnrollment"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Student not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /students/{id}/courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List a student's course enrollments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of course enrollments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseEnrollment"

  /students/{id}/courses/{enrollmentId}:
    get:
      operationId: getCourseEnrollment
      tags: [courses]
      summary: Get a single course enrollment with computed module progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Course enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseEnrollment"
        "404":
          description: Enrollment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /students/{id}/certificates:
    get:
      operationId: listCertificates
      tags: [courses]
      summary: List a student's issued course certificates
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of course certificates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseCertificate"

  /students/{id}/courses/{enrollmentId}/progress:
    patch:
      operationId: updateCourseProgress
      tags: [courses]
      summary: Update completed lessons and watched videos for an enrollment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourseProgressBody"
      responses:
        "200":
          description: Updated course enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseEnrollment"
        "404":
          description: Enrollment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /students/{id}/courses/{enrollmentId}/modules/{moduleId}/quiz:
    post:
      operationId: submitModuleQuiz
      tags: [courses]
      summary: Submit answers for a module quiz and get the score
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: integer
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitQuizBody"
      responses:
        "200":
          description: Quiz result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"
        "404":
          description: Enrollment or module not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /students/{id}/courses/{enrollmentId}/final-exam/generate:
    post:
      operationId: generateFinalExam
      tags: [courses]
      summary: Generate the final exam for a course enrollment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated final exam
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalExam"
        "404":
          description: Enrollment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /students/{id}/courses/{enrollmentId}/final-exam/submit:
    post:
      operationId: submitFinalExam
      tags: [courses]
      summary: Submit answers for the final exam and get the score
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitExamBody"
      responses:
        "200":
          description: Final exam result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamResult"
        "404":
          description: Enrollment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /students/{id}/courses/{enrollmentId}/certificate-interview/{interviewSessionId}/link:
    post:
      operationId: linkCertificateInterview
      tags: [courses]
      summary: Link a completed interview session to a course enrollment for certification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: integer
        - name: interviewSessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Interview link result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateInterviewResult"
        "404":
          description: Enrollment or interview session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /students/{id}/courses/{enrollmentId}/certificate:
    post:
      operationId: issueCertificate
      tags: [courses]
      summary: Issue a course certificate for a completed enrollment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Issued course certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseCertificate"
        "403":
          description: Not allowed (e.g. guest account)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Enrollment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /students/{id}/courses/{enrollmentId}/certificate/resume-flag:
    patch:
      operationId: setCertificateResumeFlag
      tags: [courses]
      summary: Toggle whether a certificate appears on the student's resume
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCertificateResumeFlagBody"
      responses:
        "200":
          description: Updated course certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseCertificate"
        "404":
          description: Certificate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /students/{id}/skills/confirm:
    post:
      operationId: confirmSkill
      tags: [courses]
      summary: Confirm a skill with a self-reported proficiency
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmSkillBody"
      responses:
        "200":
          description: Updated skills
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillsResult"
        "404":
          description: Student not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /certs/{slug}:
    get:
      operationId: getPublicCertificate
      tags: [courses]
      summary: Public certificate verification page (unauthenticated)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCertificate"
        "404":
          description: Certificate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

