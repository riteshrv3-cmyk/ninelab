    Resume:
      type: object
      properties:
        id:
          type: integer
        studentId:
          type: integer
        name:
          type: string
        templateId:
          type: string
        jdText:
          type: string
          nullable: true
        companyName:
          type: string
          nullable: true
        roleTitle:
          type: string
          nullable: true
        jobTags:
          type: array
          items:
            type: string
        content:
          type: object
          description: ResumeDocument (see @workspace/resume-core) — a nested, versioned shape not modeled field-by-field here.
          additionalProperties: true
        atsScore:
          type: integer
          nullable: true
        atsReport:
          type: object
          nullable: true
          additionalProperties: true
        schemaVersion:
          type: integer
        parentResumeId:
          type: integer
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - studentId
        - name
        - templateId
        - content
        - createdAt

    GenerateResumeBody:
      type: object
      properties:
        templateId:
          type: string
          enum: [ats, classic, tech, minimal]
        jdText:
          type: string
          deprecated: true
          description: No longer sent by the app (generation is profile-driven); tolerated for old clients.
        companyName:
          type: string
          deprecated: true
          description: No longer sent by the app; tolerated for old clients.
        resumeName:
          type: string
        roleTitle:
          type: string
        jobTags:
          type: array
          items:
            type: string
        parentResumeId:
          type: integer
          description: ID of the resume this was retargeted from. Used for lineage tracking.

    ResumeBullet:
      description: v1 sent plain strings; v2 sends {text, evidence}. Both accepted — upgradeContent normalizes server-side.
      oneOf:
        - type: string
        - type: object
          properties:
            text:
              type: string
            evidence:
              type: array
              items:
                type: string
          required:
            - text

    UpdateResumeContent:
      type: object
      description: Fields the edit surface can change — everything is editable, including contact, headline, education, and section order. upgradeContent coerces v1-flat shapes on the server.
      properties:
        contact:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
            phone:
              type: string
              nullable: true
            city:
              type: string
              nullable: true
            links:
              type: array
              items:
                type: object
                properties:
                  label:
                    type: string
                  url:
                    type: string
                  kind:
                    type: string
                    enum: [github, linkedin, portfolio, email, phone]
                required:
                  - label
                  - url
                  - kind
          required:
            - name
            - email
        headline:
          type: string
        summary:
          type: string
        order:
          type: array
          items:
            type: string
            enum: [summary, experience, projects, skills, education, certifications, achievements]
        skillSections:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              items:
                description: v1 sent a comma-joined string; v2 sends string[]. Both accepted.
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: string
              evidence:
                type: array
                items:
                  type: string
            required:
              - category
              - items
        experience:
          type: array
          items:
            type: object
            properties:
              company:
                type: string
              role:
                type: string
              period:
                type: string
              start:
                type: string
              end:
                type: string
              employmentType:
                type: string
              location:
                type: string
              bullets:
                type: array
                items:
                  $ref: "#/components/schemas/ResumeBullet"
            required:
              - company
              - role
        projects:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              tech:
                description: v1 sent a comma-joined string; v2 sends string[]. Both accepted.
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: string
              link:
                type: string
                nullable: true
              bullets:
                type: array
                items:
                  $ref: "#/components/schemas/ResumeBullet"
            required:
              - title
              - tech
        education:
          type: array
          items:
            type: object
            properties:
              degree:
                type: string
              institution:
                type: string
              field:
                type: string
              location:
                type: string
              start:
                type: string
              end:
                type: string
              cgpa:
                type: string
                nullable: true
              coursework:
                type: array
                items:
                  type: string
            required:
              - degree
              - institution
        certifications:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              issuer:
                type: string
              date:
                type: string
                nullable: true
              link:
                type: string
                nullable: true
            required:
              - name
              - issuer
        achievements:
          type: array
          items:
            $ref: "#/components/schemas/ResumeBullet"

    UpdateResumeBody:
      type: object
      description: content and/or templateId — at least one must be provided
      properties:
        content:
          $ref: "#/components/schemas/UpdateResumeContent"
        templateId:
          type: string
          enum: [ats, classic, tech, minimal]
        snapshot:
          type: boolean
          description: If true, the resume's pre-edit content is pushed onto its version history (capped at 5, oldest dropped) before this patch is applied.

    ImproveSectionBody:
      type: object
      properties:
        section:
          type: string
          enum: [summary, headline, skills, experience, projects, achievements]
      required:
