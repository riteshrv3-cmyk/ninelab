                  - note
            topFixes:
              type: array
              items:
                type: string
          required:
            - sevenSecondRead
            - sectionNotes
            - topFixes
        band:
          type: string
        percentileCopy:
          type: string
        qualityScore:
          type: integer
        cached:
          type: boolean
      required:
        - review
        - band
        - percentileCopy
        - qualityScore
        - cached

    QuantQuestionsResult:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              section:
                type: string
                enum: [experience, projects]
              entryIndex:
                type: integer
              bulletIndex:
                type: integer
              bulletText:
                type: string
              questions:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    prompt:
                      type: string
                    unit:
                      type: string
                    kind:
                      type: string
                      enum: [count, percent, duration, money]
                  required:
                    - id
                    - prompt
                    - unit
                    - kind
            required:
              - section
              - entryIndex
              - bulletIndex
              - bulletText
              - questions
      required:
        - items

    QuantApplyBody:
      type: object
      properties:
        section:
          type: string
          enum: [experience, projects]
        entryIndex:
          type: integer
        bulletIndex:
          type: integer
        answers:
          type: array
          maxItems: 2
          items:
            type: object
            properties:
              questionId:
                type: string
              prompt:
                type: string
              value:
                type: string
                description: Plain number as typed, e.g. "120" or "42.5".
              unit:
                type: string
            required:
              - questionId
              - prompt
              - value
              - unit
      required:
        - section
        - entryIndex
        - bulletIndex
        - answers

    QuantApplyResult:
      type: object
      properties:
        text:
          type: string
        evidence:
          type: array
          items:
            type: string
        quantFacts:
          type: array
          items:
            type: object
            additionalProperties: true
      required:
        - text
        - evidence
        - quantFacts

    CourseEnrollment:
      type: object
      properties:
        id:
          type: integer
        studentId:
          type: integer
        subDomainId:
          type: string
        subDomainName:
          type: string
        domainId:
          type: string
        domainName:
          type: string
        skills:
          type: array
          items:
            type: string
        courseData:
          type: object
          nullable: true
          additionalProperties: true
        completedLessonIds:
          type: array
          items:
            type: string
        watchedVideoIds:
          type: array
          items:
            type: string
        status:
          type: string
        startedAt:
          type: string
        completedAt:
          type: string
          nullable: true
        updatedAt:
          type: string
        passedModuleIds:
          type: array
          items:
            type: string
      required:
        - id
        - studentId
        - subDomainId
        - subDomainName
        - domainId
        - domainName
        - skills
        - completedLessonIds
        - watchedVideoIds
        - status
        - startedAt
        - updatedAt
        - passedModuleIds

    EnrollCourseBody:
      type: object
      properties:
        subDomainId:
